<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="home.css" />
  </head>

  <body>

    <nav class="always-displayed">
      <h1> Bloqueur Web </h1>
      <button data-target="home">Accueil</button>
      <button data-target="settings">Réglages</button>
    </nav>

    <div class="page" id="starting-page">
      <h1> Starting page </h1>
      <p> Test text </p>
      <button class="start-btn" type="button" data-target="home"> Start </button>
    </div>
    
    <div class="page" id="home">
        <div class="button home" id="btn-home-1"> 
          <button class="btn-bloquer" type="button" data-target="block-menu">
            Bloquer un site web précis 
          </button>
        </div>
        <div class="button home"> 
          <button class="" type="button">
            Fonctionnalités de blocage
          </button>
        </div>
        <div class="button home">
            <button class="" type="button">
              Version premium
            </button>
        </div>
    </div>

    <div class="page" id="block-menu">
      <h1> Rentrez l'url du site que vous voulez bloquer </h1>
      <button id="btn-enable-disable"> Activer/Désactiver </button>
      <div class="hidden-2">
          <form class="form-url" id="form-url-id">
              <div class="form-url">
                  <label for="blockedUrl"> URL : </label>
                  <input type="text" name="url" id="url-input" required />
              </div>
              <div class="form-url">
                  <input type="submit" id="btn-bloquer" value="Bloquer"/>
              </div>
          </form>
          <h2> Urls bloquées : </h2>
          <ul id="blocked-urls-list">
          </ul>
      </div>
    </div>
    
    <div id="error-content" class="hidden">
      <p>Cette page ne peut être transformée.</p>
      <p>Veuillez essayer une autre page.</p>
    </div>

    
  </body>

  <script src="home.js"></script>

</html>
