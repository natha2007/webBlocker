<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="home.css" />
  </head>

  <body>

    <nav class="always-displayed">
      <h1> Web blocker </h1>
      <button data-target="home">Home</button>
      <button data-target="settings">Settings</button>
    </nav>

    <div class="page" id="starting-page">
      <h1> Starting page </h1>
      <button class="start-btn" type="button" data-target="home"> Start </button>
    </div>
    
    <div class="page" id="home">
        <div class="button home" id="btn-home-1"> 
          <button class="btn-bloquer" type="button" data-target="block-menu">
            Block a specific website 
          </button>
        </div>
        <div class="button home"> 
          <button class="" type="button">
            blocking functionalities 
          </button>
        </div>
        <div class="button home">
            <button class="" type="button">
              Premium version
            </button>
        </div>
    </div>

    <div class="page" id="block-menu">
      <h1> Enter website URL that you want to block </h1>
      <button id="btn-enable-disable"> Enable/Disable </button>
      <div class="hidden-2">
          <form class="form-url" id="form-url-id">
              <div class="form-url">
                  <label for="blockedUrl"> URL : </label>
                  <input type="text" name="url" id="url-input" required />
              </div>
              <div class="form-url">
                  <input type="submit" id="btn-bloquer" value="Block"/>
              </div>
          </form>
          <h2> Blocked URLs : </h2>
          <ul id="blocked-urls-list">
          </ul>
      </div>
    </div>
    
    <div id="error-content" class="hidden">
      <p>That page cannot be transformed</p>
      <p>Try another page</p>
    </div>

    
  </body>

  <script src="home.js"></script>

</html>
